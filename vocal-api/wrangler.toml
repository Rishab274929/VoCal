name = "vocal"
compatibility_date = "2025-04-01"
pages_build_output_dir = "vocal-web/dist"

# D1 database binding for the production environment. Declared here so
# `wrangler pages deploy` picks it up — without this the prod functions
# saw env.DB as undefined and the Pro entitlement gate fell through to
# fail-closed (everything returned 402 pro_required even when there was
# a legitimate entitlement). Discovered 2026-05-17 while wiring up the
# user_entitlements table.
[[env.production.d1_databases]]
binding = "DB"
database_name = "vocal-prod"
database_id = "c1b80f2b-0416-4979-b68d-e048f5d80bd5"
migrations_dir = "db/migrations"

# Bindings are configured in the Cloudflare dashboard for production. Set:
#
# LLM providers (any combination — the pool rotates across whatever's set):
#   - WAFER_API_KEY / WAFER_API_KEYS         (Secret) — flat-rate, vision-capable
#   - GEMINI_API_KEY / GEMINI_API_KEYS       (Secret) — free tier, vision-capable
#   - GROQ_API_KEY / GROQ_API_KEYS           (Secret) — fast text-only Llama 3.x
#   - MISTRAL_API_KEY / MISTRAL_API_KEYS     (Secret) — text-only fallback
#   - OPENROUTER_API_KEY / OPENROUTER_API_KEYS (Secret) — pay-as-you-go fallback
#
# Auth (REQUIRED in production — without these the auth endpoints refuse to sign):
#   - JWT_SECRET                  (Secret, min 16 chars) — HS256 signing key
#   - GOOGLE_CLIENT_ID_IOS        (Secret) — at least one required for /api/auth/google
#   - GOOGLE_CLIENT_ID_ANDROID    (Secret)
#   - GOOGLE_CLIENT_ID_WEB        (Secret)
#   - APPLE_BUNDLE_ID             (Secret) — REQUIRED for /api/auth/apple; iOS bundle ID
#                                 used as the `aud` claim on Apple's identity_token
#   - APPLE_AUDIENCES             (Secret, optional) — CSV of extra audiences
#                                 (e.g. a Services ID for Sign in with Apple JS)
#
# Other infra:
#   - USDA_FDC_API_KEY            (Secret, optional) — FDC lookups + barcode resolution
#   - FOOD_KV                     (KV namespace, optional) — 30-day meal cache
#   - DB                          (D1 database, optional) — meal log persistence
#
# Entitlements / paywall:
#   - APPLE_SHARED_SECRET         (Secret) — app-specific shared secret from
#                                 App Store Connect → My Apps → App Information
#                                 → App-Specific Shared Secret. REQUIRED for
#                                 /api/entitlements/refresh to verify receipts;
#                                 without it that endpoint returns 503.
#                                 Pro-gated endpoints (/api/coach,
#                                 /api/coach/voice, /api/bodyfat,
#                                 /api/photo/parse, /api/voice/parse) check
#                                 the user_entitlements table in D1 and
#                                 return 402 pro_required if the row is
#                                 missing/expired/is_pro=0.
#
# Do NOT put any of these under [vars] in this file — `[vars]` values are
# plaintext in the deployed config and visible to anyone with build access.
# Use the Cloudflare dashboard Secrets UI, or `wrangler secret put NAME`.
#
# For `wrangler pages dev` locally, create vocal-api/.dev.vars with the same
# keys (gitignored at the repo root) to avoid putting secrets in this file.
