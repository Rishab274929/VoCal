[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prophet-lab"
version = "0.1.0"
description = "SigmaProphet — AI forecasting agent for Prophet Arena (UncommonHacks 2026)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eric Spencer", email = "ericspencer1450@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "click>=8.1.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "ai-prophet-core>=0.1.0",
    "ai-prophet>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
prophet-lab = "sigma_prophet.cli:main"
sigma-prophet = "sigma_prophet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sigma_prophet*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
